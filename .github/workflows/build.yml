name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip build.zip
        run: |
          unzip build.zip -d project
          ls -la project

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Allow insecure protocols
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'EOF'
          allprojects {
              buildscript {
                  repositories {
                      all { repo ->
                          repo.allowInsecureProtocol = true
                      }
                  }
              }
              repositories {
                  all { repo ->
                      repo.allowInsecureProtocol = true
                  }
              }
          }
          EOF

      - name: Build with Gradle
        working-directory: project
        run: gradle build --init-script ~/.gradle/init.gradle --stacktrace

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mod-jar
          path: 'project/build/libs/*.jar'
          if-no-files-found: warn
          retention-days: 30
