name: Build Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip build.zip
        run: |
          unzip build.zip -d project
          ls -la project

      - name: Fix getFuse() issue
        run: |
          sed -i 's/closest\.getFuse()/closest.fuse/g' project/src/main/java/com/purpleclient/hud/HUDOverlay.java
          grep -n "closest" project/src/main/java/com/purpleclient/hud/HUDOverlay.java

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Setup Gradle 4.10.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 4.10.3

      - name: Build with Gradle
        working-directory: project
        run: gradle build --stacktrace

      - name: Find built jar
        id: find_jar
        run: |
          echo "=== All files in build/libs ==="
          ls -la project/build/libs/
          echo "=== Filtering out -sources.jar and -dev.jar ==="
          JAR=$(find project/build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" ! -name "*-javadoc.jar" | head -n 1)
          echo "Selected JAR: $JAR"
          echo "jar_path=$JAR" >> $GITHUB_OUTPUT
          echo "jar_name=$(basename $JAR)" >> $GITHUB_OUTPUT

      - name: Verify selected jar
        run: |
          echo "Final selected jar: ${{ steps.find_jar.outputs.jar_name }}"
          echo "Path: ${{ steps.find_jar.outputs.jar_path }}"
          unzip -l "${{ steps.find_jar.outputs.jar_path }}" | head -n 20

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          files: ${{ steps.find_jar.outputs.jar_path }}
          token: ${{ secrets.GITHUB_TOKEN }}
